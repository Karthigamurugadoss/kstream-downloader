<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c0f"/>
      <stop offset="50%" style="stop-color:#131318"/>
      <stop offset="100%" style="stop-color:#1a1a22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1db954;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#1db954;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#1db954;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/><line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/><line x1="760" y1="0" x2="760" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/><line x1="840" y1="0" x2="840" y2="400"/>
    <line x1="880" y1="0" x2="880" y2="400"/><line x1="920" y1="0" x2="920" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1040" y1="0" x2="1040" y2="400"/><line x1="1080" y1="0" x2="1080" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/><line x1="1160" y1="0" x2="1160" y2="400"/>
    <line x1="1200" y1="0" x2="1200" y2="400"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
  </g>

  <!-- Green glow -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="url(#glow)"/>

  <!-- Spotify icon -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#1db954"/>
    <text x="28" y="38" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700" fill="#0c0c0f">K</text>
  </g>

  <!-- Title -->
  <text x="180" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ededf0" letter-spacing="-2">KSpotify</text>

  <!-- Subtitle -->
  <text x="100" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6e6e82">Download Spotify songs, playlists &amp; albums</text>

  <!-- Tags -->
  <g transform="translate(100, 250)">
    <rect x="0" y="0" width="85" height="28" rx="5" fill="rgba(29,185,84,0.12)"/>
    <text x="42" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="500" fill="#1db954">open source</text>

    <rect x="95" y="0" width="95" height="28" rx="5" fill="rgba(29,185,84,0.12)"/>
    <text x="142" y="19" text-anchor="middle" font-family="monospace" font-size="12" font-weight="500" fill="#1db954">free forever</text>
  </g>

  <!-- Stats -->
  <g transform="translate(100, 310)">
    <text x="0" y="20" font-family="monospace" font-size="22" font-weight="700" fill="#ededf0">320k</text>
    <text x="70" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#6e6e82">max bitrate</text>

    <text x="170" y="20" font-family="monospace" font-size="22" font-weight="700" fill="#ededf0">MP3/FLAC</text>
    <text x="300" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#6e6e82">audio formats</text>

    <text x="400" y="20" font-family="monospace" font-size="22" font-weight="700" fill="#ededf0">ZIP</text>
    <text x="445" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#6e6e82">playlist export</text>
  </g>

  <!-- Mini app preview card -->
  <g transform="translate(700, 80)">
    <rect x="0" y="0" width="400" height="240" rx="12" fill="#131318" stroke="#2a2a35" stroke-width="1"/>

    <!-- Card header -->
    <text x="24" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ededf0">Download track</text>
    <rect x="310" y="18" width="65" height="24" rx="4" fill="rgba(29,185,84,0.12)"/>
    <text x="342" y="35" text-anchor="middle" font-family="monospace" font-size="9" font-weight="500" fill="#1db954">SINGLE</text>

    <!-- URL input -->
    <text x="24" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#6e6e82">Spotify Track URL</text>
    <rect x="24" y="74" width="352" height="36" rx="6" fill="#1a1a22" stroke="#2a2a35" stroke-width="1"/>
    <text x="36" y="97" font-family="monospace" font-size="11" fill="#6e6e82">https://open.spotify.com/track/...</text>

    <!-- Format and Quality -->
    <text x="24" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#6e6e82">Format</text>
    <rect x="24" y="138" width="168" height="32" rx="6" fill="#1a1a22" stroke="#2a2a35" stroke-width="1"/>
    <text x="36" y="159" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#ededf0">MP3</text>

    <text x="208" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#6e6e82">Quality</text>
    <rect x="208" y="138" width="168" height="32" rx="6" fill="#1a1a22" stroke="#2a2a35" stroke-width="1"/>
    <text x="220" y="159" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#ededf0">320 kbps</text>

    <!-- Download button -->
    <rect x="24" y="190" width="352" height="36" rx="6" fill="#1db954"/>
    <text x="200" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0c0c0f">Download Track</text>
  </g>

  <!-- Bottom branding -->
  <g transform="translate(700, 340)">
    <rect x="0" y="0" width="24" height="24" rx="5" fill="#1db954"/>
    <text x="12" y="17" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0c0c0f">K</text>
    <text x="32" y="17" font-family="monospace" font-size="13" font-weight="500" fill="#6e6e82">kspotify</text>
    <text x="120" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#35354a">·</text>
    <text x="135" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#6e6e82">github.com/Karthigamurugadoss</text>
  </g>

  <!-- Border -->
  <rect x="0" y="0" width="1200" height="400" rx="0" fill="none" stroke="#2a2a35" stroke-width="1"/>
</svg>